<section class="relative min-h-screen bg-brandLight flex items-center justify-center px-4 py-12 overflow-hidden font-sans">

  <!-- Background blobs -->
  <div class="absolute -top-32 -right-24 w-[500px] h-[500px] rounded-full bg-brandPrimary/10 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -left-20 w-80 h-80 rounded-full bg-brandSecondary/10 blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 right-1/4 w-56 h-56 rounded-full bg-brandAccent/40 blur-3xl pointer-events-none"></div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-[460px] bg-brandWhite border border-brandAccent rounded-2xl p-10 shadow-xl
              animate-[fadeUp_0.45s_ease_both]">

    <!-- Brand -->
    <div class="flex items-center gap-2.5 mb-8">
      <div class="flex items-center justify-center w-10 h-10 bg-brandPrimary rounded-xl text-brandWhite">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </div>
      <span class="text-2xl font-extrabold text-brandSecondary tracking-tight">TaskPilot</span>
    </div>

    <!-- Heading -->
    <div class="mb-7">
      <h1 class="text-[1.65rem] font-bold text-brandSecondary tracking-tight mb-1">Reset Password</h1>
      <p class="text-[0.9375rem] text-gray-500 leading-relaxed">
        Enter the OTP sent to your email along with your new password.
      </p>
    </div>

    <!-- Success banner -->
    <div *ngIf="isSuccess"
         class="flex items-start gap-3.5 p-4 bg-brandPrimary/5 border border-brandPrimary/25 rounded-xl mb-6
                animate-[fadeUp_0.4s_ease_both]">
      <div class="shrink-0 flex items-center justify-center w-9 h-9 bg-brandPrimary rounded-full text-brandWhite">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div>
        <p class="font-bold text-[0.9375rem] text-brandSecondary mb-0.5">Password Reset!</p>
        <p class="text-sm text-gray-500">Your password has been updated. Redirecting to login…</p>
      </div>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-4" (ngSubmit)="onSubmit()" *ngIf="!isSuccess" novalidate>

      <!-- OTP -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-brandSecondary" for="otp">OTP Code</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input
            id="otp"
            name="otp"
            type="text"
            [ngModel]="otp()"
            (ngModelChange)="otp.set($event)"
            maxlength="10"
            autocomplete="one-time-code"
            [disabled]="isLoading"
            placeholder="Enter OTP code"
            class="w-full pl-11 pr-4 py-3 bg-brandLight border-[1.5px] rounded-[10px] text-[0.9375rem]
                   text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                   placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                   focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
            [class.border-brandAccent]="state() !== 'error'"
            [class.border-brandPrimary]="state() === 'error'"
          />
        </div>
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-brandSecondary" for="reset-email">Email Address</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M22 7l-10 7L2 7"/>
            </svg>
          </span>
          <input
            id="reset-email"
            name="email"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            autocomplete="email"
            [disabled]="isLoading"
            placeholder="you@example.com"
            class="w-full pl-11 pr-4 py-3 bg-brandLight border-[1.5px] rounded-[10px] text-[0.9375rem]
                   text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                   placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                   focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
            [class.border-brandAccent]="state() !== 'error'"
            [class.border-brandPrimary]="state() === 'error'"
          />
        </div>
      </div>

      <!-- New Password -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-brandSecondary" for="new-password">New Password</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          <input
            id="new-password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            autocomplete="new-password"
            [disabled]="isLoading"
            placeholder="Min. 6 characters"
            class="w-full pl-11 pr-11 py-3 bg-brandLight border-[1.5px] rounded-[10px] text-[0.9375rem]
                   text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                   placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                   focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
            [class.border-brandAccent]="state() !== 'error'"
            [class.border-brandPrimary]="state() === 'error'"
          />
          <button type="button" (click)="togglePassword()" tabindex="-1"
                  class="absolute right-3.5 top-1/2 -translate-y-1/2 text-brandAccent
                         hover:text-brandPrimary transition-colors duration-200 p-0 bg-transparent border-0 cursor-pointer">
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- Strength bar -->
        <div *ngIf="password()" class="flex items-center gap-2.5 mt-1">
          <div class="flex-1 h-1 bg-brandAccent/50 rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all duration-300"
                 [class.w-1/3]="passwordStrength === 'weak'"
                 [class.bg-brandPrimary]="passwordStrength === 'weak'"
                 [class.w-2/3]="passwordStrength === 'medium'"
                 [class.bg-yellow-400]="passwordStrength === 'medium'"
                 [class.w-full]="passwordStrength === 'strong'"
                 [class.bg-emerald-500]="passwordStrength === 'strong'">
            </div>
          </div>
          <span class="text-xs font-semibold min-w-[44px]"
                [class.text-brandPrimary]="passwordStrength === 'weak'"
                [class.text-yellow-500]="passwordStrength === 'medium'"
                [class.text-emerald-500]="passwordStrength === 'strong'">
            {{ passwordStrength | titlecase }}
          </span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-brandSecondary" for="confirm-password">Confirm Password</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          <input
            id="confirm-password"
            name="confirmPassword"
            [type]="showConfirm() ? 'text' : 'password'"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            autocomplete="new-password"
            [disabled]="isLoading"
            placeholder="Repeat your password"
            class="w-full pl-11 pr-11 py-3 bg-brandLight border-[1.5px] rounded-[10px] text-[0.9375rem]
                   text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                   placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                   focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
            [class.border-brandAccent]="!(state() === 'error' || (confirmPassword() && password() !== confirmPassword()))"
            [class.border-brandPrimary]="state() === 'error' || (confirmPassword() && password() !== confirmPassword())"
          />
          <button type="button" (click)="toggleConfirm()" tabindex="-1"
                  class="absolute right-3.5 top-1/2 -translate-y-1/2 text-brandAccent
                         hover:text-brandPrimary transition-colors duration-200 p-0 bg-transparent border-0 cursor-pointer">
            <svg *ngIf="!showConfirm()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showConfirm()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <p *ngIf="confirmPassword() && password() !== confirmPassword()"
           class="text-[0.8125rem] font-medium text-brandPrimary">
          Passwords don't match
        </p>
      </div>

      <!-- Global error -->
      <div *ngIf="state() === 'error'"
           class="text-sm font-medium text-brandPrimary bg-brandPrimary/5
                  border border-brandPrimary/20 rounded-lg px-3.5 py-2.5">
        {{ errorMessage() }}
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="mt-1 flex items-center justify-center gap-2 w-full py-3.5 bg-brandPrimary text-brandWhite
               rounded-[10px] text-base font-semibold transition-all duration-200
               hover:opacity-[0.88] hover:-translate-y-px active:translate-y-0
               disabled:opacity-65 disabled:cursor-not-allowed disabled:transform-none">
        <span *ngIf="isLoading"
              class="w-[18px] h-[18px] rounded-full border-2 border-white/30 border-t-white animate-spin shrink-0">
        </span>
        <span>{{ isLoading ? 'Resetting…' : 'Reset Password' }}</span>
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center mt-5 text-sm text-gray-500">
      <a routerLink="/forgot-password"
         class="inline-flex items-center gap-1.5 text-brandPrimary font-semibold no-underline
                transition-opacity duration-200 hover:opacity-75">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Resend OTP
      </a>
    </p>

  </div>
</section>
