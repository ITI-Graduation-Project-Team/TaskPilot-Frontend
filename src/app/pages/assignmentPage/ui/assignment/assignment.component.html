<div class="h-[calc(100vh-64px)] flex flex-col bg-surface-base">
  
  <div *ngIf="isLoadingPage()" class="flex-1 flex flex-col items-center justify-center">
    <div class="animate-spin h-8 w-8 text-primary-base mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>
    <p class="text-content-muted">Loading assignment data...</p>
  </div>

  <ng-container *ngIf="!isLoadingPage()">
    <!-- Top Header -->
    <div class="px-6 py-4 border-b border-border-base bg-surface-base flex justify-between items-center relative">
      <div>
        <h1 class="text-xl font-bold text-content-base">Sprint Assignment</h1>
        <p class="text-sm text-content-muted">Review AI suggestions and configure team workload</p>
      </div>
    </div>

    <!-- Main Content: 2 Columns -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- Left Column: Task List (40%) -->
      <div class="w-2/5 h-full">
        <app-task-list 
          [tasks]="suggestions()"
          [selectedTaskId]="selectedTaskId()"
          [localAssignments]="localAssignments()"
          (taskSelected)="onTaskSelected($event)"
        ></app-task-list>
      </div>

      <!-- Right Column: Developer Cards (60%) -->
      <div class="w-3/5 h-full">
        <app-employee-selector
          [selectedTask]="selectedTask()"
          [currentAssigneeId]="currentAssigneeId()"
          (assignEmployee)="onAssignEmployee($event)"
        ></app-employee-selector>
      </div>

    </div>

    <!-- Bottom Footer: Confirm Button -->
    <div class="p-4 border-t border-border-base bg-surface-elevated flex justify-end">
      <button 
        [disabled]="!canConfirm()"
        (click)="confirmAssignments()"
        class="px-4 py-2 rounded-md font-medium text-brandWhite bg-brandPrimary w-full transition-opacity"
        [class.opacity-50]="!canConfirm()"
        [class.pointer-events-none]="!canConfirm()"
      >
        {{ isConfirming() ? 'Confirming...' : 'Confirm Assignments' }}
      </button>
    </div>
  </ng-container>
</div>
