<section class="relative min-h-screen bg-brandLight flex items-center justify-center px-4 py-12 overflow-hidden font-sans" [attr.dir]="currentLang() === 'ar' ? 'rtl' : 'ltr'">

  <!-- Language Toggle -->
  <div class="absolute top-6 z-50 transition-all duration-300" [class.right-6]="currentLang() === 'en'" [class.left-6]="currentLang() === 'ar'">
    <button (click)="toggleLanguage()" type="button"
            class="flex items-center gap-2 px-3.5 py-1.5 bg-brandWhite text-brandSecondary rounded-full border border-brandAccent shadow-sm hover:bg-brandLight transition-all font-bold uppercase text-xs">
      <span>{{ currentLang() === 'en' ? 'ar' : 'en' }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>
  </div>

  <!-- Background blobs -->
  <div class="absolute -top-28 -left-28 w-96 h-96 rounded-full bg-brandPrimary/10 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-20 -right-20 w-72 h-72 rounded-full bg-brandSecondary/10 blur-3xl pointer-events-none"></div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-md bg-brandWhite border border-brandAccent rounded-2xl p-10 shadow-xl
              animate-[fadeUp_0.45s_ease_both]">

    <!-- Brand -->
    <div class="flex items-center gap-2.5 mb-8">
      <img src="/TaskPilotLogo.svg" alt="TaskPilot Logo" class="h-10" />
    </div>

    <!-- Heading -->
    <div class="mb-7">
      <h1 class="text-[1.65rem] font-bold text-brandSecondary tracking-tight mb-1">{{ 'forgotPassword.title' | translate }}</h1>
      <p class="text-[0.9375rem] text-gray-500 leading-relaxed">
        {{ 'forgotPassword.subtitle' | translate }}
      </p>
    </div>

    <!-- Success banner -->
    <div *ngIf="isSuccess"
         class="flex items-start gap-3.5 p-4 bg-brandPrimary/5 border border-brandPrimary/25 rounded-xl mb-6
                animate-[fadeUp_0.4s_ease_both]">
      <div class="shrink-0 flex items-center justify-center w-9 h-9 bg-brandPrimary rounded-full text-brandWhite">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div>
        <p class="font-bold text-[0.9375rem] text-brandSecondary mb-0.5">{{ 'forgotPassword.emailSent' | translate }}</p>
        <p class="text-sm text-gray-500">{{ 'forgotPassword.emailSentDesc' | translate }}</p>
      </div>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()" *ngIf="!isSuccess" novalidate>

      <!-- Email field -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-brandSecondary" for="email">{{ 'forgotPassword.emailLabel' | translate }}</label>
        <div class="relative">
          <span class="absolute ltr:left-3.5 rtl:right-3.5 top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M22 7l-10 7L2 7"/>
            </svg>
          </span>
          <input
            id="email"
            name="email"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            autocomplete="email"
            [disabled]="isLoading"
            [placeholder]="'forgotPassword.emailPlaceholder' | translate"
            class="w-full ltr:pl-11 rtl:pr-11 ltr:pr-4 rtl:pl-4 py-3 bg-brandLight border-[1.5px] rounded-[10px] text-[0.9375rem]
                   text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                   placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                   focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
            [class.border-brandAccent]="state() !== 'error'"
            [class.border-brandPrimary]="state() === 'error'"
            [class.ring-2]="state() === 'error'"
            [class.ring-brandPrimary/10]="state() === 'error'"
          />
        </div>
        <p *ngIf="state() === 'error'" class="text-[0.8125rem] font-medium text-brandPrimary">
          {{ errorMessage() }}
        </p>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="mt-1 flex items-center justify-center gap-2 w-full py-3.5 bg-brandPrimary text-brandWhite
               rounded-[10px] text-base font-semibold transition-all duration-200
               hover:opacity-[0.88] hover:-translate-y-px active:translate-y-0
               disabled:opacity-65 disabled:cursor-not-allowed disabled:transform-none">
        <span *ngIf="isLoading"
              class="w-[18px] h-[18px] rounded-full border-2 border-white/30 border-t-white animate-spin shrink-0">
        </span>
        <span>{{ isLoading ? ('forgotPassword.sending' | translate) : ('forgotPassword.sendResetCode' | translate) }}</span>
      </button>

    </form>

    <!-- Back link -->
    <p class="text-center mt-6 text-sm text-gray-500">
      <a routerLink="/login"
         class="inline-flex items-center gap-1.5 text-brandPrimary font-semibold no-underline
                transition-opacity duration-200 hover:opacity-75">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 rtl:-scale-x-100" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        {{ 'forgotPassword.backToSignIn' | translate }}
      </a>
    </p>

  </div>
</section>
