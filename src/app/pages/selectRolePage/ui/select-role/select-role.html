<section class="relative min-h-screen bg-brandLight flex items-center justify-center px-4 py-12 overflow-hidden font-sans">
  
  <!-- Language Toggle -->
  <div class="absolute top-6 right-6 z-50">
    <button (click)="toggleLanguage()"
            class="flex items-center gap-2 px-3 py-1.5 bg-white text-gray-700 rounded-full border border-gray-300 hover:bg-gray-100 dark:bg-slate-800 dark:text-teal-400 dark:border-teal-400/30 dark:hover:bg-slate-700 transition-colors shadow-sm">
      <span class="text-sm font-bold uppercase">{{ currentLang() === 'en' ? 'ar' : 'en' }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>
  </div>

  <!-- Background blobs -->
  <div class="absolute -top-32 -left-24 w-[500px] h-[500px] rounded-full bg-brandPrimary/8 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-20 w-80 h-80 rounded-full bg-brandSecondary/8 blur-3xl pointer-events-none"></div>

  <!-- ══════════ ROLE SELECTION ══════════ -->
  <div class="relative z-10 w-full max-w-[640px] flex flex-col items-center text-center animate-[fadeUp_0.45s_ease_both]">

    <!-- Logo -->
    <div class="flex items-center gap-2.5 mb-8">
      <img src="/TaskPilotLogo.svg" alt="TaskPilot Logo" class="h-10" />
    </div>

    <!-- Heading -->
    <h1 class="text-4xl font-extrabold text-brandSecondary tracking-tight mb-2">{{ 'register.welcome' | translate }}</h1>
    <p class="text-base text-gray-500 mb-10">{{ 'register.describe' | translate }}</p>

    <!-- Role Cards -->
    <div class="grid grid-cols-2 gap-5 w-full max-w-[540px] mb-10 max-[500px]:grid-cols-1">

      <!-- Employee -->
      <button id="role-employee"
              (click)="selectRole('Employee')"
              class="group flex flex-col items-center text-center bg-brandWhite border border-brandAccent rounded-2xl overflow-hidden
                     cursor-pointer shadow-sm transition-all duration-200
                     hover:-translate-y-1.5 hover:shadow-xl hover:shadow-brandPrimary/10 hover:border-brandPrimary/40
                     animate-[scaleIn_0.4s_ease_both]">
        <!-- Visual gradient -->
        <div class="w-full flex items-center justify-center py-10
                    bg-gradient-to-br from-red-50 via-brandLight to-rose-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-brandSecondary" viewBox="0 0 64 64" fill="none">
            <!-- Glowing background circle -->
            <circle cx="32" cy="32" r="28" fill="url(#employeeGrad)" class="opacity-15" />
            
            <!-- User silhouette -->
            <path d="M32 38c-8.8 0-16 4.8-16 10.8V52h32v-3.2c0-6-7.2-10.8-16-10.8z" fill="currentColor" opacity="0.85" />
            <circle cx="32" cy="24" r="8" fill="currentColor" opacity="0.85" />
            
            <!-- Floating checkmark badge -->
            <g transform="translate(36, 32)">
              <rect width="20" height="20" rx="6" fill="#FAFAFA" stroke="#D51C39" stroke-width="1.8" />
              <path d="M6 10l3 3 5-6" stroke="#D51C39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </g>
            
            <defs>
              <linearGradient id="employeeGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#D51C39" />
                <stop offset="1" stop-color="#DECCCC" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <!-- Label -->
        <div class="px-4 pb-5 pt-3">
          <p class="text-[1.0625rem] font-bold text-brandSecondary" [class.flex]="currentLang() === 'ar'" [class.items-center]="currentLang() === 'ar'" [class.gap-1]="currentLang() === 'ar'">
            {{ 'register.employee' | translate }}
            <span class="inline-block transition-transform duration-200" [ngClass]="currentLang() === 'ar' ? 'group-hover:-translate-x-1' : 'group-hover:translate-x-1'">{{ currentLang() === 'ar' ? '←' : '→' }}</span>
          </p>
          <p class="text-[0.8125rem] text-gray-500 mt-0.5">{{ 'register.employeeDesc' | translate }}</p>
        </div>
      </button>

      <!-- Project Manager -->
      <button id="role-project-manager"
              (click)="selectRole('ProjectManager')"
              class="group flex flex-col items-center text-center bg-brandWhite border border-brandAccent rounded-2xl overflow-hidden
                     cursor-pointer shadow-sm transition-all duration-200
                     hover:-translate-y-1.5 hover:shadow-xl hover:shadow-brandPrimary/10 hover:border-brandPrimary/40
                     animate-[scaleIn_0.4s_0.1s_ease_both]">
        <!-- Visual gradient -->
        <div class="w-full flex items-center justify-center py-10
                    bg-gradient-to-br from-rose-50 via-brandLight to-red-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-brandSecondary" viewBox="0 0 64 64" fill="none">
            <!-- Glowing background circle -->
            <circle cx="32" cy="32" r="28" fill="url(#pmGrad)" class="opacity-15" />
            
            <!-- User silhouette -->
            <path d="M32 38c-8.8 0-16 4.8-16 10.8V52h32v-3.2c0-6-7.2-10.8-16-10.8z" fill="currentColor" opacity="0.85" />
            <circle cx="32" cy="24" r="8" fill="currentColor" opacity="0.85" />
            
            <!-- Floating Dashboard panel -->
            <g transform="translate(34, 30)">
              <rect width="24" height="20" rx="5" fill="#FAFAFA" stroke="#121338" stroke-width="1.8" />
              <!-- Dashboard rows/columns representing Kanban or Gantt -->
              <rect x="4" y="5" width="7" height="3" rx="1" fill="#D51C39" />
              <rect x="13" y="5" width="7" height="3" rx="1" fill="#DECCCC" />
              <rect x="4" y="11" width="16" height="4" rx="1" fill="#121338" />
            </g>
            
            <defs>
              <linearGradient id="pmGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#121338" />
                <stop offset="1" stop-color="#DECCCC" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <!-- Label -->
        <div class="px-4 pb-5 pt-3">
          <p class="text-[1.0625rem] font-bold text-brandSecondary" [class.flex]="currentLang() === 'ar'" [class.items-center]="currentLang() === 'ar'" [class.gap-1]="currentLang() === 'ar'">
            {{ 'register.projectManager' | translate }}
            <span class="inline-block transition-transform duration-200" [ngClass]="currentLang() === 'ar' ? 'group-hover:-translate-x-1' : 'group-hover:translate-x-1'">{{ currentLang() === 'ar' ? '←' : '→' }}</span>
          </p>
          <p class="text-[0.8125rem] text-gray-500 mt-0.5">{{ 'register.pmDesc' | translate }}</p>
        </div>
      </button>

    </div>

    <!-- Footer -->
    <p class="text-sm text-gray-500">
      {{ 'register.alreadyHaveAccount' | translate }}
      <a routerLink="/login" class="text-brandPrimary font-semibold no-underline hover:opacity-75 transition-opacity" [class.ml-1]="currentLang() === 'en'" [class.mr-1]="currentLang() === 'ar'">{{ 'register.signIn' | translate }}</a>
    </p>
  </div>

</section>
