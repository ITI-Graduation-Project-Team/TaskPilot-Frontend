<section class="relative min-h-screen bg-brandLight flex flex-col items-center justify-center px-4 py-12 overflow-hidden font-sans">
  
  <!-- Language Toggle -->
  <div class="absolute top-6 right-6 z-50">
    <button (click)="toggleLanguage()"
            class="flex items-center gap-2 px-3 py-1.5 bg-slate-950 text-teal-400 rounded-full border border-teal-400/30 hover:bg-slate-900 transition-colors">
      <span class="text-sm font-bold uppercase">{{ currentLang() === 'en' ? 'ar' : 'en' }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>
  </div>

  <!-- Blobs -->
  <div class="absolute -top-28 -right-24 w-[460px] h-[460px] rounded-full bg-brandPrimary/10 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-20 -left-16 w-72 h-72 rounded-full bg-brandSecondary/10 blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 left-1/4 w-52 h-52 rounded-full bg-brandAccent/40 blur-3xl pointer-events-none"></div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-md bg-brandWhite border border-brandAccent rounded-2xl p-10 shadow-xl animate-[fadeUp_0.45s_ease_both]">

    <!-- Brand -->
    <div class="flex items-center gap-2.5 mb-8">
      <img src="/TaskPilotLogo.svg" alt="TaskPilot Logo" class="h-10" />
    </div>

    <!-- Heading -->
    <div class="mb-7">
      <h1 class="text-[1.65rem] font-bold text-brandSecondary tracking-tight mb-1">{{ 'login.welcomeBack' | translate }}</h1>
      <p class="text-[0.9375rem] text-gray-500 leading-relaxed">{{ 'login.signInDesc' | translate }}</p>
    </div>

    <!-- Error banner -->
    <div *ngIf="state() === 'error'"
         class="flex items-center gap-3 p-4 bg-brandPrimary/5 border border-brandPrimary/30 rounded-xl mb-5
                animate-[fadeUp_0.35s_ease_both]">
      <div class="shrink-0 flex items-center justify-center w-8 h-8 bg-brandPrimary/10 rounded-full text-brandPrimary">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <p class="text-sm font-medium text-brandPrimary leading-relaxed mb-0">{{ errorMessage() }}</p>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()" novalidate>

      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-brandSecondary" for="login-email">{{ 'login.emailLabel' | translate }}</label>
        <div class="relative">
          <span class="absolute top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none" [class.right-3.5]="currentLang() === 'ar'" [class.left-3.5]="currentLang() === 'en'">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/>
            </svg>
          </span>
          <input id="login-email" name="email" type="email"
                 [ngModel]="email()" (ngModelChange)="email.set($event)"
                 [disabled]="isLoading" placeholder="you@example.com" autocomplete="email"
                 class="w-full py-3 bg-brandLight border-[1.5px] border-brandAccent rounded-[10px]
                        text-[0.9375rem] text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                        placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                        focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
                 [ngClass]="currentLang() === 'ar' ? 'pr-11 pl-4' : 'pl-11 pr-4'"
                 [class.border-brandPrimary]="state() === 'error'"
                 [class.ring-2]="state() === 'error'"
                 [class.ring-brandPrimary]="state() === 'error'"/>
        </div>
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-sm font-semibold text-brandSecondary" for="login-password">{{ 'login.passwordLabel' | translate }}</label>
          <a routerLink="/forgot-password"
             class="text-xs font-semibold text-brandPrimary no-underline hover:opacity-75 transition-opacity duration-200">
            {{ 'login.forgotPassword' | translate }}
          </a>
        </div>
        <div class="relative">
          <span class="absolute top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none" [class.right-3.5]="currentLang() === 'ar'" [class.left-3.5]="currentLang() === 'en'">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          <input id="login-password" name="password"
                 [type]="showPassword() ? 'text' : 'password'"
                 [ngModel]="password()" (ngModelChange)="password.set($event)"
                 [disabled]="isLoading" placeholder="******" autocomplete="current-password"
                 class="w-full px-11 py-3 bg-brandLight border-[1.5px] border-brandAccent rounded-[10px]
                        text-[0.9375rem] text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                        placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                        focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
                 [class.border-brandPrimary]="state() === 'error'"
                 [class.ring-2]="state() === 'error'"
                 [class.ring-brandPrimary]="state() === 'error'"/>
          <button type="button" (click)="togglePassword()" tabindex="-1"
                  class="absolute top-1/2 -translate-y-1/2 text-brandAccent hover:text-brandPrimary
                         transition-colors duration-200 p-0 bg-transparent border-0 cursor-pointer"
                  [class.left-3.5]="currentLang() === 'ar'" [class.right-3.5]="currentLang() === 'en'">
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Remember me -->
      <label class="flex items-center gap-2.5 cursor-pointer select-none -mt-1">
        <input type="checkbox" name="rememberMe"
               [ngModel]="rememberMe()" (ngModelChange)="rememberMe.set($event)"
               class="w-4 h-4 rounded border-brandAccent accent-brandPrimary cursor-pointer"/>
        <span class="text-sm text-gray-500 font-medium">{{ 'login.rememberMe' | translate }}</span>
      </label>


      <!-- Submit -->
      <button type="submit" [disabled]="isLoading"
              class="flex items-center justify-center gap-2 w-full py-3.5 bg-brandPrimary text-brandWhite
                     rounded-[10px] text-base font-semibold transition-all duration-200
                     hover:opacity-[0.88] hover:-translate-y-px active:translate-y-0
                     disabled:opacity-65 disabled:cursor-not-allowed disabled:transform-none">
        <span *ngIf="isLoading" class="w-[18px] h-[18px] rounded-full border-2 border-white/30 border-t-white animate-spin shrink-0"></span>
        <span>{{ isLoading ? ('login.signingIn' | translate) : ('login.signIn' | translate) }}</span>
      </button>

      <div class="flex items-center my-2">
        <div class="flex-grow border-t border-brandAccent"></div>
        <span class="mx-3 text-sm text-gray-400">{{ 'login.orContinueWith' | translate }}</span>
        <div class="flex-grow border-t border-brandAccent"></div>
      </div>

      <!-- Google Sign In Button -->
      <div class="w-full flex justify-center h-[40px] relative">
        <div id="google-btn-container" class="absolute z-10 w-full h-full overflow-hidden opacity-0" style="left: 0; right: 0;"></div>
        <button type="button" (click)="onGoogleSignIn()" class="flex items-center justify-center gap-3 w-full py-2.5 bg-white border border-gray-300 text-gray-700 rounded-md shadow-sm text-sm font-medium hover:bg-gray-50 transition-colors pointer-events-auto">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
          {{ 'login.continueWithGoogle' | translate }}
        </button>
      </div>

    </form>

    <!-- Footer -->
    <p class="text-center mt-5 text-sm text-gray-500">
      {{ 'login.noAccount' | translate }}
      <a routerLink="/register" class="text-brandPrimary font-semibold no-underline hover:opacity-75 transition-opacity duration-200" [class.ml-1]="currentLang() === 'en'" [class.mr-1]="currentLang() === 'ar'">
        {{ 'login.createOne' | translate }}
      </a>
    </p>

  </div>
</section>
