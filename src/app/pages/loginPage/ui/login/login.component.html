<section class="relative min-h-screen bg-brandLight flex items-center justify-center px-4 py-12 overflow-hidden font-sans">

  <!-- Blobs -->
  <div class="absolute -top-28 -right-24 w-[460px] h-[460px] rounded-full bg-brandPrimary/10 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-20 -left-16 w-72 h-72 rounded-full bg-brandSecondary/10 blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 left-1/4 w-52 h-52 rounded-full bg-brandAccent/40 blur-3xl pointer-events-none"></div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-md bg-brandWhite border border-brandAccent rounded-2xl p-10 shadow-xl animate-[fadeUp_0.45s_ease_both]">

    <!-- Brand -->
    <div class="flex items-center gap-2.5 mb-8">
      <div class="flex items-center justify-center w-10 h-10 bg-brandPrimary rounded-xl text-brandWhite shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </div>
      <span class="text-2xl font-extrabold text-brandSecondary tracking-tight">TaskPilot</span>
    </div>

    <!-- Heading -->
    <div class="mb-7">
      <h1 class="text-[1.65rem] font-bold text-brandSecondary tracking-tight mb-1">Welcome Back</h1>
      <p class="text-[0.9375rem] text-gray-500 leading-relaxed">Sign in to continue to your workspace.</p>
    </div>

    <!-- Success banner -->
    <div *ngIf="isSuccess"
         class="flex items-start gap-3.5 p-4 bg-brandPrimary/5 border border-brandPrimary/25 rounded-xl mb-6
                animate-[fadeUp_0.4s_ease_both]">
      <div class="shrink-0 flex items-center justify-center w-9 h-9 bg-brandPrimary rounded-full text-brandWhite">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div>
        <p class="font-bold text-[0.9375rem] text-brandSecondary mb-0.5">Signed In!</p>
        <p class="text-sm text-gray-500">{{ successMessage() }}</p>
      </div>
    </div>

    <!-- Error banner -->
    <div *ngIf="state() === 'error'"
         class="flex items-start gap-3 p-4 bg-brandPrimary/5 border border-brandPrimary/30 rounded-xl mb-5
                animate-[fadeUp_0.35s_ease_both]">
      <div class="shrink-0 flex items-center justify-center w-8 h-8 bg-brandPrimary/10 rounded-full text-brandPrimary mt-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <p class="text-sm font-medium text-brandPrimary leading-relaxed">{{ errorMessage() }}</p>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()" *ngIf="!isSuccess" novalidate>

      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-brandSecondary" for="login-email">Email Address</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/>
            </svg>
          </span>
          <input id="login-email" name="email" type="email"
                 [ngModel]="email()" (ngModelChange)="email.set($event)"
                 [disabled]="isLoading" placeholder="you@example.com" autocomplete="email"
                 class="w-full pl-11 pr-4 py-3 bg-brandLight border-[1.5px] border-brandAccent rounded-[10px]
                        text-[0.9375rem] text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                        placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                        focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
                 [class.border-brandPrimary]="state() === 'error'"
                 [class.ring-2]="state() === 'error'"
                 [class.ring-brandPrimary]="state() === 'error'"/>
        </div>
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-sm font-semibold text-brandSecondary" for="login-password">Password</label>
          <a routerLink="/forgot-password"
             class="text-xs font-semibold text-brandPrimary no-underline hover:opacity-75 transition-opacity duration-200">
            Forgot password?
          </a>
        </div>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brandAccent pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          <input id="login-password" name="password"
                 [type]="showPassword() ? 'text' : 'password'"
                 [ngModel]="password()" (ngModelChange)="password.set($event)"
                 [disabled]="isLoading" placeholder="Your password" autocomplete="current-password"
                 class="w-full pl-11 pr-11 py-3 bg-brandLight border-[1.5px] border-brandAccent rounded-[10px]
                        text-[0.9375rem] text-brandSecondary outline-none transition-all duration-200 font-[inherit]
                        placeholder:text-gray-400 disabled:opacity-60 disabled:cursor-not-allowed
                        focus:bg-brandWhite focus:border-brandPrimary focus:ring-2 focus:ring-brandPrimary/15"
                 [class.border-brandPrimary]="state() === 'error'"
                 [class.ring-2]="state() === 'error'"
                 [class.ring-brandPrimary]="state() === 'error'"/>
          <button type="button" (click)="togglePassword()" tabindex="-1"
                  class="absolute right-3.5 top-1/2 -translate-y-1/2 text-brandAccent hover:text-brandPrimary
                         transition-colors duration-200 p-0 bg-transparent border-0 cursor-pointer">
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Remember me -->
      <label class="flex items-center gap-2.5 cursor-pointer select-none -mt-1">
        <input type="checkbox" name="rememberMe"
               [ngModel]="rememberMe()" (ngModelChange)="rememberMe.set($event)"
               class="w-4 h-4 rounded border-brandAccent accent-brandPrimary cursor-pointer"/>
        <span class="text-sm text-gray-500 font-medium">Remember me</span>
      </label>


      <!-- Submit -->
      <button type="submit" [disabled]="isLoading"
              class="flex items-center justify-center gap-2 w-full py-3.5 bg-brandPrimary text-brandWhite
                     rounded-[10px] text-base font-semibold transition-all duration-200
                     hover:opacity-[0.88] hover:-translate-y-px active:translate-y-0
                     disabled:opacity-65 disabled:cursor-not-allowed disabled:transform-none">
        <span *ngIf="isLoading" class="w-[18px] h-[18px] rounded-full border-2 border-white/30 border-t-white animate-spin shrink-0"></span>
        <span>{{ isLoading ? 'Signing In…' : 'Sign In' }}</span>
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center mt-5 text-sm text-gray-500">
      Don't have an account?
      <a routerLink="/register" class="text-brandPrimary font-semibold no-underline hover:opacity-75 transition-opacity duration-200 ml-1">
        Create one
      </a>
    </p>

  </div>
</section>
