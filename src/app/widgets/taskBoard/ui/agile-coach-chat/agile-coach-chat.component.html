@if (isOpen()) {
  <div class="bg-surface border border-border rounded-2xl shadow-sm overflow-hidden mt-4 animate-[fadeUp_0.2s_ease_both] flex flex-col">
    <!-- HEADER BAR -->
    <div class="p-4 bg-sidebar border-b border-border flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-primary/10 text-primary rounded-xl flex items-center justify-center shadow-sm">
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
          </svg>
        </div>
        <h3 class="text-sm font-bold text-text-primary">Agile Coach</h3>
      </div>
      <button (click)="closed.emit()" class="p-1.5 hover:bg-border rounded-lg transition-colors text-text-secondary">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- MESSAGES AREA -->
    <div id="agile-chat-messages" class="flex-1 max-h-80 overflow-y-auto p-4 space-y-4 bg-background">
      @for (message of messages(); track $index) {
        @if (message.role === 'user') {
          <div class="flex gap-3 max-w-[85%] ml-auto flex-row-reverse">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-primary text-white font-bold text-xs">
              You
            </div>
            <div class="p-3 text-sm leading-relaxed border bg-primary border-primary text-white rounded-2xl rounded-tr-sm">
              {{ message.content }}
            </div>
          </div>
        } @else {
          <div class="flex gap-3 max-w-[85%]">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-primary/10 text-primary text-base">
              🤖
            </div>
            <div class="p-3 text-sm leading-relaxed border bg-sidebar border-border text-text-primary rounded-2xl rounded-tl-sm">
              {{ message.content }}
            </div>
          </div>
        }
      }

      <!-- Streaming Assistant Message -->
      @if (isStreaming() && streamingContent()) {
        <div class="flex gap-3 max-w-[85%]">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-primary/10 text-primary text-base">🤖</div>
          <div class="p-3 text-sm leading-relaxed border bg-sidebar border-border text-text-primary rounded-2xl rounded-tl-sm">
            {{ streamingContent() }}
            <span class="inline-block w-0.5 h-4 bg-primary animate-pulse ml-0.5 align-middle"></span>
          </div>
        </div>
      }

      <!-- Typing Indicator -->
      @if (isStreaming() && !streamingContent()) {
        <div class="flex gap-3 max-w-[85%]">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-primary/10 text-primary text-base">🤖</div>
          <div class="p-3 text-sm leading-relaxed border bg-sidebar border-border text-text-primary rounded-2xl rounded-tl-sm flex items-center gap-1.5 h-[46px]">
            <div class="w-1.5 h-1.5 bg-text-secondary rounded-full animate-bounce delay-0"></div>
            <div class="w-1.5 h-1.5 bg-text-secondary rounded-full animate-bounce delay-150"></div>
            <div class="w-1.5 h-1.5 bg-text-secondary rounded-full animate-bounce delay-300"></div>
          </div>
        </div>
      }
    </div>

    <!-- INPUT ROW -->
    <div class="p-4 border-t border-border bg-sidebar shrink-0">
      <div class="flex gap-2">
        <input type="text"
               [value]="inputText()"
               (input)="inputText.set($any($event.target).value)"
               (keydown.enter)="sendMessage()"
               [disabled]="isStreaming()"
               placeholder="Ask a question about this task..."
               class="flex-1 bg-background border border-border rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/20 transition-all disabled:opacity-50"
               autocomplete="off" />
        <button (click)="sendMessage()"
                [disabled]="isStreaming() || !inputText().trim()"
                class="px-4 py-2.5 bg-primary hover:bg-primary-hover text-white rounded-xl shadow-sm transition-all disabled:opacity-50 flex items-center justify-center shrink-0 min-w-[3rem]">
          @if (isStreaming()) {
            <div class="w-4 h-4 rounded-full border-2 border-white border-t-transparent animate-spin"></div>
          } @else {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>
}
