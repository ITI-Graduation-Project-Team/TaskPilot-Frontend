<div class="flex flex-col gap-1 w-full mt-2">
  <button 
    (click)="toggle()" 
    class="flex items-center gap-1.5 w-max px-3 py-1 rounded-full text-xs font-bold border border-primary text-primary hover:bg-primary/10 transition-colors"
  >
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
    </svg>
    {{ citation().sourceDocumentDisplayName }}
  </button>

  @if (isExpanded()) {
    <div class="ml-2 pl-3 border-l-2 border-border mt-1">
      <p class="text-xs text-text-secondary italic leading-relaxed">{{ citation().chunkExcerpt }}</p>
    </div>
  }
</div>
